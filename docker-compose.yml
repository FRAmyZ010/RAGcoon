services:
  # ---------------------------------------------------------------------------
  # 1. Database Service: PostgreSQL with pgvector extension
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ragcoon-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpassword}
      POSTGRES_DB: ${POSTGRES_DB:-ragcoon_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raguser} -d ${POSTGRES_DB:-ragcoon_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ragcoon-network

  # ---------------------------------------------------------------------------
  # 2. Database GUI: pgAdmin 4
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4
    container_name: ragcoon-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "8080:80"
    depends_on:
      - postgres
    networks:
      - ragcoon-network

  # ---------------------------------------------------------------------------
  # 3. LLM Inference Service: Ollama
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ragcoon-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: >
      /bin/sh -c "
      ollama serve &
      PID=$$!;
      echo '⏳ Waiting for Ollama service to start...';
      sleep 5;
      echo '📥 Pulling default RAGcoon LLM model gemma3:4b (extra models can be pulled from AI Config)...';
      ollama pull gemma3:4b || true;
      echo '✅ Ollama default model ready!';
      wait $$PID
      "
    networks:
      - ragcoon-network

  # ---------------------------------------------------------------------------
  # 4. Backend Service: FastAPI + RAG Engine (bind-mount + --reload)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ragcoon-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-raguser}:${POSTGRES_PASSWORD:-ragpassword}@postgres:5432/${POSTGRES_DB:-ragcoon_db}
      - POSTGRES_HOST=postgres
      - OLLAMA_BASE_URL=http://ollama:11434
      # Must match a model that the ollama service actually pulls
      - OLLAMA_MODEL=gemma3:4b
      # Avoid CUDA/meta-tensor crashes when embedding documents for Qdrant upload
      - CUDA_VISIBLE_DEVICES=
      - TOKENIZERS_PARALLELISM=false
      # Smaller embedding model to reduce RAM pressure on Windows Docker
      - EMBEDDING_MODEL=intfloat/multilingual-e5-small
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - huggingface_cache:/root/.cache/huggingface
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - ragcoon-network

  # ---------------------------------------------------------------------------
  # 5. Frontend Service: Vite dev server (hot reload)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ragcoon-frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8000
      # Help file watching through Docker Desktop (especially Windows)
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ragcoon-network

networks:
  ragcoon-network:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:
  huggingface_cache:
  frontend_node_modules:
