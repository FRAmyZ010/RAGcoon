services:
  # Database Service: PostgreSQL
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ragcoon-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpassword}
      POSTGRES_DB: ${POSTGRES_DB:-ragcoon_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raguser} -d ${POSTGRES_DB:-ragcoon_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Web Management GUI: pgAdmin 4
  pgadmin:
    image: dpage/pgadmin4
    container_name: ragcoon-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "8080:80"
    depends_on:
      - postgres

  # LLM Service: Ollama
  ollama:
    image: ollama/ollama:latest
    container_name: ragcoon-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # เพิ่ม entrypoint เพื่อสั่ง pull โมเดลอัตโนมัติขณะเริ่มรัน Container
    entrypoint: >
      /bin/sh -c "
      ollama serve &
      PID=$$!;
      echo '⏳ Waiting for Ollama service to start...';
      sleep 5;
      echo '📥 Pulling model qwen2.5:7b...';
      ollama pull qwen2.5:7b;
      echo '✅ Model pulled successfully!';
      wait $$PID
      "
    restart: always

  # Backend Service: FastAPI
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragcoon-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-raguser}:${POSTGRES_PASSWORD:-ragpassword}@postgres:5432/${POSTGRES_DB:-ragcoon_db}
      - POSTGRES_HOST=postgres
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - .:/app
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  postgres_data:
  ollama_data: