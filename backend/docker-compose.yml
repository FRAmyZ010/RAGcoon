version: '3.8'

services:
  # 1. Database Service: PostgreSQL Container
  postgres_db:
    image: postgres:15-alpine
    container_name: ragcoon_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend Service: FastAPI Container
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragcoon_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_DB}:5432/${POSTGRES_DB}
    volumes:
      - .:/app
    depends_on:
      postgres_db:
        condition: service_healthy

volumes:
  postgres_data: